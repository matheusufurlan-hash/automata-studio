<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerUnits="userSpaceOnUse" markerWidth="64" markerHeight="64" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="7" refY="5" markerUnits="userSpaceOnUse" markerWidth="64" markerHeight="64" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/>
    </marker>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- seta de entrada -->
  <path d="M140 560 L222 560" stroke="#ffffff" stroke-width="30" stroke-linecap="round" fill="none" marker-end="url(#arrow)"/>
  <!-- q0 -->
  <circle cx="352" cy="560" r="104" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-width="30"/>
  <!-- laço em q0 -->
  <path d="M296 472 C 236 296, 468 296, 410 466" stroke="#ffffff" stroke-width="28" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
  <!-- transição q0 → q1 (destacada, como na simulação) -->
  <path d="M470 560 L568 560" stroke="#fbbf24" stroke-width="30" stroke-linecap="round" fill="none" marker-end="url(#arrow-amber)"/>
  <!-- q1 final (círculo duplo, ativo) -->
  <circle cx="704" cy="560" r="104" fill="#fbbf24" fill-opacity="0.22" stroke="#fbbf24" stroke-width="30"/>
  <circle cx="704" cy="560" r="70" fill="none" stroke="#fbbf24" stroke-width="22"/>
</svg>
